{% extends "base.html" %}

{% block title %}Activity Logs - TCC Display System{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">Activity Logs</h2>
        <button class="btn btn-outline-primary rounded-pill" onclick="exportLogs()">
            <i class="bi bi-download me-2"></i>Export CSV
        </button>
    </div>

    
    <div class="card border-0 shadow-sm mb-4" style="border: 2px solid #800000 !important;">
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label">Type</label>
                    <select class="form-select" id="filterType">
                        <option value="">All Types</option>
                        <option value="text">Text Display</option>
                        <option value="audio">Audio</option>
                        <option value="video">Video</option>
                        <option value="emergency">Emergency</option>
                        <option value="sms">SMS</option>
                        <option value="email">Email</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Status</label>
                    <select class="form-select" id="filterStatus">
                        <option value="">All Statuses</option>
                        <option value="success">Success</option>
                        <option value="failed">Failed</option>
                        <option value="pending">Pending</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Date From</label>
                    <input type="date" class="form-control" id="filterDateFrom">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Date To</label>
                    <input type="date" class="form-control" id="filterDateTo">
                </div>
            </div>
            <div class="mt-3">
                <button class="btn btn-primary rounded-pill me-2" onclick="applyFilters()">
                    <i class="bi bi-funnel me-2"></i>Apply Filters
                </button>
                <button class="btn btn-outline-secondary rounded-pill" onclick="clearFilters()">
                    <i class="bi bi-x-circle me-2"></i>Clear
                </button>
            </div>
        </div>
    </div>

    
    <div class="card border-0 shadow-sm" style="border: 2px solid #800000 !important;">
        <div class="card-header text-white d-flex justify-content-between align-items-center" style="background-color: #800000;">
            <h5 class="mb-0"><i class="bi bi-list-ul me-2"></i>Activity History</h5>
            <div class="d-flex gap-2">
                <span id="selectedCount" class="badge bg-light text-dark d-none">0 selected</span>
                <button id="btnDeleteSelected" class="btn btn-sm btn-danger d-none" onclick="deleteSelected()">
                    <i class="bi bi-trash me-1"></i>Delete Selected
                </button>
                <button class="btn btn-sm btn-outline-light" onclick="confirmDeleteAll()">
                    <i class="bi bi-trash3 me-1"></i>Delete All
                </button>
            </div>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th style="width:40px;">
                                <input type="checkbox" id="selectAllChk" class="form-check-input" onclick="toggleSelectAll(this)">
                            </th>
                            <th>Timestamp</th>
                            <th>Type</th>
                            <th>Channel</th>
                            <th>Target</th>
                            <th>Details</th>
                            <th>Status</th>
                            <th>User</th>
                        </tr>
                    </thead>
                    <tbody id="logsTableBody">
                        <tr>
                            <td colspan="8" class="text-center text-muted">Loading logs...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            
            <nav aria-label="Page navigation" class="mt-3">
                <ul class="pagination justify-content-center" id="pagination"></ul>
            </nav>
        </div>
    </div>
</div>

<script>
let currentPage = 1;
let filters = {};

document.addEventListener('DOMContentLoaded', function() {
    loadLogs();
    
    // Set default date range (last 7 days)
    const today = new Date();
    const weekAgo = new Date(today.getTime() - 7 * 24 * 60 * 60 * 1000);
    document.getElementById('filterDateFrom').valueAsDate = weekAgo;
    document.getElementById('filterDateTo').valueAsDate = today;
});

function loadLogs(page = 1) {
    currentPage = page;
    
    const queryParams = new URLSearchParams({
        page: page,
        ...filters
    });
    
    fetch(`/api/logs?${queryParams}`)
        .then(response => response.json())
        .then(data => {
            const tbody = document.getElementById('logsTableBody');
            
            if (data.logs && data.logs.length > 0) {
                tbody.innerHTML = data.logs.map(log => {
                    const statusBadge = getStatusBadge(log.status);
                    const typeBadge   = getTypeBadge(log.type);
                    return `
                        <tr>
                            <td>
                                <input type="checkbox" class="form-check-input row-chk"
                                       value="${log.id}" onchange="updateBulkBar()">
                            </td>
                            <td>${formatDateTime(log.timestamp)}</td>
                            <td>${typeBadge}</td>
                            <td>${log.channel || 'N/A'}</td>
                            <td>
                                <span class="badge rounded-pill text-bg-secondary fw-normal"
                                      style="font-size:.78rem;white-space:normal;max-width:200px;
                                             word-break:break-word;display:inline-block;text-align:left;">
                                    ${log.target || 'All'}
                                </span>
                            </td>
                            <td>
                                <button class="btn btn-sm btn-outline-primary" onclick="viewDetails(${log.id})">
                                    <i class="bi bi-eye"></i> View
                                </button>
                            </td>
                            <td>${statusBadge}</td>
                            <td>${log.username || 'System'}</td>
                        </tr>
                    `;
                }).join('');
                updatePagination(data.total_pages, page);
                // Reset select-all checkbox
                document.getElementById('selectAllChk').checked = false;
                updateBulkBar();
            } else {
                tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted">No logs found</td></tr>';
            }
        })
        .catch(error => {
            console.error('Error loading logs:', error);
            document.getElementById('logsTableBody').innerHTML = 
                '<tr><td colspan="7" class="text-center text-danger">Error loading logs</td></tr>';
        });
}

function applyFilters() {
    filters = {
        type: document.getElementById('filterType').value,
        status: document.getElementById('filterStatus').value,
        date_from: document.getElementById('filterDateFrom').value,
        date_to: document.getElementById('filterDateTo').value
    };
    
    // Remove empty filters
    Object.keys(filters).forEach(key => {
        if (!filters[key]) delete filters[key];
    });
    
    loadLogs(1);
}

function clearFilters() {
    document.getElementById('filterType').value = '';
    document.getElementById('filterStatus').value = '';
    document.getElementById('filterDateFrom').value = '';
    document.getElementById('filterDateTo').value = '';
    filters = {};
    loadLogs(1);
}

function getStatusBadge(status) {
    const badges = {
        'success': '<span class="badge bg-success">Success</span>',
        'failed': '<span class="badge bg-danger">Failed</span>',
        'pending': '<span class="badge bg-warning">Pending</span>',
        'cancelled': '<span class="badge bg-secondary">Cancelled</span>'
    };
    return badges[status] || '<span class="badge bg-secondary">Unknown</span>';
}

function getTypeBadge(type) {
    const badges = {
        'text': '<span class="badge" style="background-color: #800000;">Text</span>',
        'audio': '<span class="badge bg-primary">Audio</span>',
        'video': '<span class="badge bg-info">Video</span>',
        'emergency': '<span class="badge bg-danger">Emergency</span>',
        'sms': '<span class="badge bg-success">SMS</span>',
        'email': '<span class="badge bg-warning">Email</span>'
    };
    return badges[type] || '<span class="badge bg-secondary">' + type + '</span>';
}

function formatDateTime(timestamp) {
    const date = new Date(timestamp);
    return date.toLocaleString('en-US', {
        year: 'numeric',
        month: 'short',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
    });
}

function updatePagination(totalPages, currentPage) {
    const pagination = document.getElementById('pagination');
    let html = '';
    
    // Previous button
    html += `
        <li class="page-item ${currentPage === 1 ? 'disabled' : ''}">
            <a class="page-link" href="#" onclick="loadLogs(${currentPage - 1}); return false;">Previous</a>
        </li>
    `;
    
    // Page numbers
    for (let i = 1; i <= totalPages; i++) {
        if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
            html += `
                <li class="page-item ${i === currentPage ? 'active' : ''}">
                    <a class="page-link" href="#" onclick="loadLogs(${i}); return false;">${i}</a>
                </li>
            `;
        } else if (i === currentPage - 3 || i === currentPage + 3) {
            html += '<li class="page-item disabled"><a class="page-link" href="#">...</a></li>';
        }
    }
    
    // Next button
    html += `
        <li class="page-item ${currentPage === totalPages ? 'disabled' : ''}">
            <a class="page-link" href="#" onclick="loadLogs(${currentPage + 1}); return false;">Next</a>
        </li>
    `;
    
    pagination.innerHTML = html;
}

function viewDetails(logId) {
    fetch(`/api/logs/${logId}`)
        .then(response => response.json())
        .then(data => {
            if (data.log) {
                const log = data.log;
                const details =
`Timestamp : ${formatDateTime(log.timestamp)}
Type      : ${log.type}
Target    : ${log.target || 'All'}
Status    : ${log.status}
User      : ${log.username || 'System'}

Details:
${log.details || 'No additional details'}`;
                tccInfo(details, 'Log Details');
            }
        });
}

function toggleSelectAll(chk) {
    document.querySelectorAll('.row-chk').forEach(c => c.checked = chk.checked);
    updateBulkBar();
}

function updateBulkBar() {
    const checked = document.querySelectorAll('.row-chk:checked');
    const count   = checked.length;
    const countEl = document.getElementById('selectedCount');
    const btnEl   = document.getElementById('btnDeleteSelected');
    if (count > 0) {
        countEl.textContent = `${count} selected`;
        countEl.classList.remove('d-none');
        btnEl.classList.remove('d-none');
    } else {
        countEl.classList.add('d-none');
        btnEl.classList.add('d-none');
    }
    // Sync select-all state
    const total = document.querySelectorAll('.row-chk').length;
    document.getElementById('selectAllChk').indeterminate = count > 0 && count < total;
    document.getElementById('selectAllChk').checked = total > 0 && count === total;
}

function deleteSelected() {
    const ids = Array.from(document.querySelectorAll('.row-chk:checked')).map(c => parseInt(c.value));
    if (!ids.length) return;
    tccConfirm(
        `Delete ${ids.length} selected log record(s)? This action cannot be undone.`,
        'Delete Logs',
        () => {
            fetch('/api/logs/delete', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ids})
            })
            .then(r => r.json())
            .then(data => {
                if (data.success) loadLogs(currentPage);
                else tccAlert('Error: ' + data.error, 'danger');
            })
            .catch(err => tccAlert('Request failed: ' + err.message, 'danger'));
        },
        'Delete Selected'
    );
}

function confirmDeleteAll() {
    tccConfirm(
        'Delete ALL log records permanently? This action cannot be undone.',
        'Clear All Logs',
        () => {
            fetch('/api/logs/delete', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({confirm_all: true})
            })
            .then(r => r.json())
            .then(data => {
                if (data.success) loadLogs(1);
                else tccAlert('Error: ' + data.error, 'danger');
            })
            .catch(err => tccAlert('Request failed: ' + err.message, 'danger'));
        },
        'Clear All'
    );
}

function exportLogs() {
    const queryParams = new URLSearchParams(filters);
    window.location.href = `/api/logs/export?${queryParams}`;
}
</script>
{% endblock %}
