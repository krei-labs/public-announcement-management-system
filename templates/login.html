<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TCC Announcement System</title>
    
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        :root {
            --primary-maroon: #800000;
            --accent-gold: #FFD700;
        }
        
        body {
            background: linear-gradient(135deg, var(--primary-maroon) 0%, #600000 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }
        
        .login-card {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .login-header h1 {
            color: var(--primary-maroon);
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .login-header p {
            color: #666;
            font-size: 14px;
        }
        
        .form-control {
            border-radius: 25px;
            padding: 12px 20px;
            border: 2px solid #ddd;
        }
        
        .form-control:focus {
            border-color: var(--primary-maroon);
            box-shadow: 0 0 0 0.2rem rgba(128, 0, 0, 0.25);
        }
        
        .btn-login {
            background-color: var(--primary-maroon);
            color: white;
            border: none;
            border-radius: 25px;
            padding: 12px;
            width: 100%;
            font-weight: bold;
            font-size: 16px;
            margin-top: 20px;
        }
        
        .btn-login:hover {
            background-color: #600000;
            color: white;
        }
        
        .college-logo {
            width: 110px;
            height: 110px;
            object-fit: contain;
            display: block;
            margin: 0 auto 20px;
        }
        
        .college-badge-fallback {
            width: 110px;
            height: 110px;
            background-color: var(--primary-maroon);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: var(--accent-gold);
            font-size: 36px;
            font-weight: bold;
        }
        
        .alert {
            border-radius: 10px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <img 
                src="/media/images/logo.png"
                alt="Tanauan City College Logo"
                class="college-logo"
                onerror="this.style.display='none'; document.getElementById('tcc-badge-fallback').style.display='flex';"
            >
            <div class="college-badge-fallback" id="tcc-badge-fallback" style="display:none;">TCC</div>
            <h1>Tanauan City College</h1>
            <p>Public Announcement &amp; Display System</p>
        </div>
        
        {% if error %}
        <div class="alert alert-danger" role="alert">
            <strong>Error:</strong> {{ error }}
        </div>
        {% endif %}
        
        <form method="POST" action="{{ url_for('login') }}">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" name="username" required autofocus>
            </div>
            
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            
            <button type="submit" class="btn btn-login">
                Login
            </button>
        </form>
        
        <div class="text-center mt-4">
            <small class="text-muted">Set ADMIN_USERNAME and ADMIN_PASSWORD in .env</small>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
